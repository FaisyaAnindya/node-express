name: Node.js 4-Stage Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: BUILD
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install

  # JOB 2: TEST (Berjalan setelah Build selesai)
  test:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Run Unit Tests
        run: npm test

  # JOB 3: RELEASE (Hanya di branch main setelah Test sukses)
  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Create Release Artifact
        run: |
          echo "Membuat artifact untuk versi: ${{ github.sha }}"
          tar -czf release-${{ github.sha }}.tar.gz app server.js package.json

  # JOB 4: DEPLOY (Hanya di branch main setelah Release sukses)
  deploy:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy Application
        run: |
          echo "Deploying to production environment..."
          # Contoh: restart aplikasi dengan PM2
          # pm2 restart node-app || pm2 start server.js --name node-app

